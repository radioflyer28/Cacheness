name: Controlled performance qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-performance:
    name: controlled Linux performance envelope
    environment: controlled-performance
    runs-on: [self-hosted, cacheness-perf-linux-x64]
    timeout-minutes: 90
    steps:
      - name: Validate candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be one lowercase 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out the exact candidate detached
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove detached source identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" = "$CANDIDATE_SHA" ]; then
            :
          else
            echo "checked-out revision differs from candidate_sha" >&2
            exit 1
          fi
          if git symbolic-ref --quiet HEAD; then
            echo "candidate checkout must be detached" >&2
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate controlled runner fingerprint
        run: |
          test "$(uname -s)" = "Linux"
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "controlled performance runner must be x86_64" >&2
              exit 1
              ;;
          esac
          echo "CACHENESS_PERF_RUNNER=cacheness-perf-linux-x64" >> "$GITHUB_ENV"

      - name: Install frozen project dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Verify reviewed controlled envelope
        run: |
          uv run --isolated --all-extras --group dev --frozen python \
            benchmarks/phase8_benchmarks.py \
            --verify-baseline benchmarks/phase8_baseline.json \
            --all-workloads \
            --runner-identity cacheness-perf-linux-x64 \
            --output build/phase8/controlled-performance.json
          cp build/phase8/controlled-performance.json build/phase8/raw-performance.json

      # remote PostgreSQL/S3 timing is diagnostic only.  It must never enter
      # this controlled envelope or affect a timing threshold.
      # ordinary macOS timing is diagnostic only for the same reason.
      - name: Upload controlled performance envelope
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: controlled-performance-envelope
          path: |
            build/phase8/controlled-performance.json
            build/phase8/raw-performance.json
          if-no-files-found: error
          retention-days: 30
