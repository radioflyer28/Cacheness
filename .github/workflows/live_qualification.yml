name: Protected live PostgreSQL and Amazon S3 qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character lowercase candidate SHA to qualify
        required: true
        type: string
  schedule:
    - cron: "17 03 * * 2"

permissions:
  contents: read

jobs:
  release-candidate:
    name: protected exact-SHA real-service qualification
    if: github.event_name == 'workflow_dispatch'
    environment: live-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be one lowercase 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out the exact candidate detached
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove detached source identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$CANDIDATE_SHA" ]; then
            echo "checked-out revision differs from candidate_sha" >&2
            exit 1
          fi
          if git symbolic-ref --quiet HEAD; then
            echo "candidate checkout must be detached" >&2
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install frozen project dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run frozen real-service qualification
        env:
          CACHENESS_TEST_POSTGRES_DSN: ${{ secrets.CACHENESS_TEST_POSTGRES_DSN }}
          CACHENESS_TEST_S3_BUCKET: ${{ secrets.CACHENESS_TEST_S3_BUCKET }}
          CACHENESS_TEST_MANIFEST_KEY_B64: ${{ secrets.CACHENESS_TEST_MANIFEST_KEY_B64 }}
          CACHENESS_TEST_AWS_REGION: ${{ secrets.CACHENESS_TEST_AWS_REGION }}
          CACHENESS_PHASE8_QUALIFICATION_ROLE: release_candidate
        run: |
          uv run --isolated --all-extras --group dev --frozen python \
            tools/run_phase8_qualification.py \
            --role release_candidate \
            --output build/phase8/live_qualification.json
          printf 'exact live workflow run ID: %s\n' "$GITHUB_RUN_ID"

      - name: Upload release-candidate live evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: phase8-live-qualification-envelope
          path: build/phase8/live_qualification.json
          if-no-files-found: error
          retention-days: 30

  scheduled-drift:
    name: scheduled live-service drift diagnostic
    if: github.event_name == 'schedule'
    environment: live-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current default-branch schedule revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install frozen project dependencies
        run: uv sync --all-extras --group dev --frozen

      - name: Run scheduled diagnostic only
        env:
          CACHENESS_TEST_POSTGRES_DSN: ${{ secrets.CACHENESS_TEST_POSTGRES_DSN }}
          CACHENESS_TEST_S3_BUCKET: ${{ secrets.CACHENESS_TEST_S3_BUCKET }}
          CACHENESS_TEST_MANIFEST_KEY_B64: ${{ secrets.CACHENESS_TEST_MANIFEST_KEY_B64 }}
          CACHENESS_TEST_AWS_REGION: ${{ secrets.CACHENESS_TEST_AWS_REGION }}
          CACHENESS_PHASE8_QUALIFICATION_ROLE: scheduled_diagnostic
        run: |
          uv run --isolated --all-extras --group dev --frozen python \
            tools/run_phase8_qualification.py \
            --role scheduled_diagnostic \
            --output build/phase8/live_scheduled_diagnostic.json
          # Scheduled evidence is diagnostic and is never eligible for release.
          printf 'scheduled live workflow run ID: %s\n' "$GITHUB_RUN_ID"

      # Remote latency is diagnostic only and never enters release pass/fail logic.
      - name: Upload scheduled diagnostic
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: phase8-live-scheduled-diagnostic
          path: build/phase8/live_scheduled_diagnostic.json
          if-no-files-found: error
          retention-days: 30
