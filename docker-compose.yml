version: '3.8'

# ⚠️  FOR LOCAL DEVELOPMENT/TESTING ONLY ⚠️
# These services use hardcoded credentials suitable ONLY for localhost testing.
# Never expose these ports to the internet or use these credentials in production.

services:
  # PostgreSQL for metadata backend testing
  postgres:
    image: postgres:16-alpine
    container_name: cacheness-postgres
    environment:
      POSTGRES_DB: cacheness_test
      POSTGRES_USER: cacheness
      POSTGRES_PASSWORD: cacheness_dev_password  # Dev only - not for production!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacheness"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cacheness-network

  # Garage for S3-compatible testing (replaces MinIO)
  garage:
    build:
      context: .
      dockerfile: config/Dockerfile.garage
    container_name: cacheness-garage
    entrypoint: ["/bin/sh", "/etc/garage/garage-init.sh"]
    ports:
      - "3900:3900"  # S3 API endpoint
      - "3903:3903"  # Admin API
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./config/garage.toml:/etc/garage.toml:ro
      - ./config/garage-init.sh:/etc/garage/garage-init.sh:ro
    healthcheck:
      test: ["CMD", "garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - cacheness-network

volumes:
  postgres_data:
  garage_meta:
  garage_data:

networks:
  cacheness-network:
    driver: bridge
