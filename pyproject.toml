[project]
name = "cacheness"
version = "0.3.14"
description = "BlobStore-first Python storage library with cache policy layered through UnifiedCache."
readme = "README.md"
authors = [
    { name = "radioflyer28", email = "akgithub.2drwc@aleeas.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cachetools>=6.1.0",
    "cryptography>=46.0.3",
    "numpy>=2.0.0",
    "obstore==0.11.1",
    "xxhash>=3.5.0",
]

[project.optional-dependencies]
recommended = [
    "numpy>=2.0.0",
    "blosc2>=3.5.1",
    "pandas>=2.0.0,<4.0.0",
    "pyarrow>=21.0.0",
    "sqlalchemy>=2.0.0",
    "orjson>=3.8.0",
    "dill>=0.4.0",
]
dataframes = [
    "pandas>=2.0.0,<4.0.0",
    "polars>=1.30.0",
    "pyarrow>=21.0.0",
]
s3 = []
postgresql = [
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
]
cloud = [
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
]


[dependency-groups]
recommended = [
    "numpy>=2.0.0",
    "blosc2>=3.5.1",
    "pandas>=2.0.0,<4.0.0",
    "pyarrow>=21.0.0",
    "sqlalchemy>=2.0.0",
    "orjson>=3.8.0",
    "dill>=0.4.0",
]
dataframes = [
    "pandas>=2.0.0,<4.0.0",
    "polars>=1.30.0",
    "pyarrow>=21.0.0",
]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
    "moto[s3,server]>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-q", 
    "--strict-markers",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers for optional tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "optional_deps: tests that require optional dependencies like polars/pandas",
    "live_postgresql: requires an externally configured PostgreSQL service",
    "live_aws_s3: requires a real Amazon S3 bucket and standard AWS credentials",
    "live_remote: requires the qualified PostgreSQL/Amazon-S3 topology",
]

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Ignore warnings from dependencies
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["cacheness"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# lint.select = [
#     "E",  # pycodestyle errors
#     "W",  # pycodestyle warnings
#     "F",  # pyflakes
#     "I",  # isort
#     "B",  # flake8-bugbear
#     "C4", # flake8-comprehensions
#     "UP", # pyupgrade
# ]
lint.ignore = [
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]
